    <title>NEVERHOME - Gallery</title>
    <style>
        .pageframe {
            width:98vw;
            height:fit-content;
            margin:auto;
            padding:0;
            text-align:center;
            color:rgb(255, 255, 255);
            max-width:100%;
        }

        .polaroidwall {
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            align-items:flex-start;
            gap: 0.5em 0.3em;
            width:100%;
            max-width:none;
            margin: 2em auto;
            padding: 0 1em;
        }

        .polaroid {
            position:relative;
            background: #f2eee4;
            padding: 0.6em 0.6em 2em 0.6em;
            width: 220px;
            box-shadow: 0 0.5em 1.2em rgba(0,0,0,0.55);
            cursor: zoom-in;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .polaroid img {
            display:block;
            width:100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        .polaroid::before {
            content:"";
            position:absolute;
            top:-0.7em;
            left:50%;
            width:3.6em;
            height:1.3em;
            background: rgba(255,255,255,0.5);
            box-shadow: 0 0.1em 0.3em rgba(0,0,0,0.35);
            transform: translateX(-50%) rotate(-4deg);
        }

        .polaroid:hover {
            transform: rotate(0deg) scale(1.1) !important;
            box-shadow: 0 1em 2em rgba(0,0,0,0.7);
            z-index:20;
        }

        .polaroidwall .polaroid:nth-child(7n+1) { transform: rotate(-6deg); margin-top:0.6em; }
        .polaroidwall .polaroid:nth-child(7n+2) { transform: rotate(4deg);  margin-top:1.8em; }
        .polaroidwall .polaroid:nth-child(7n+3) { transform: rotate(-3deg); margin-top:0.2em; }
        .polaroidwall .polaroid:nth-child(7n+4) { transform: rotate(7deg);  margin-top:2.2em; }
        .polaroidwall .polaroid:nth-child(7n+5) { transform: rotate(-8deg); margin-top:0.9em; }
        .polaroidwall .polaroid:nth-child(7n+6) { transform: rotate(2deg);  margin-top:1.4em; }
        .polaroidwall .polaroid:nth-child(7n+7) { transform: rotate(-2deg); margin-top:0.4em; }

        @media (max-width:600px) {
            .polaroid { width:150px; padding: 0.4em 0.4em 1.5em 0.4em; }
        }

        .lightbox {
            display:none;
            position:fixed;
            top:0; left:0; right:0; bottom:0;
            background: rgba(5,3,2,0.9);
            z-index:1000;
            align-items:center;
            justify-content:center;
            padding: 2em;
            cursor: zoom-out;
        }

        .lightbox.active {
            display:flex;
        }

        .lightbox img {
            max-width:82vw;
            max-height:88vh;
            box-shadow: 0 0 2em rgba(0,0,0,0.8);
            border-radius: 0.2em;
            cursor: default;
        }

        .lightbox-close, .lightbox-prev, .lightbox-next {
            position:absolute;
            color:rgb(255,255,255);
            text-shadow: 0 0.1em 0.4em rgba(0,0,0,0.9);
            cursor:pointer;
            user-select:none;
            z-index:1001;
            transition: opacity 0.15s ease;
        }

        .lightbox-close:hover, .lightbox-prev:hover, .lightbox-next:hover {
            opacity:0.6;
        }

        .lightbox-close {
            top:0.6em;
            right:0.8em;
            font-size:2.2em;
            line-height:1;
        }

        .lightbox-prev, .lightbox-next {
            top:50%;
            transform: translateY(-50%);
            font-size:3em;
            padding:0.2em;
        }

        .lightbox-prev { left:0.3em; }
        .lightbox-next { right:0.3em; }

        @media (max-width:600px) {
            .lightbox-prev, .lightbox-next { font-size:2em; }
            .lightbox-close { font-size:1.8em; }
        }
    </style>

    <script>
        var galleryImages = [];
        var currentIndex = 0;

        function openLightbox(src) {
            galleryImages = Array.from(document.querySelectorAll('.polaroid img')).map(function(img){ return img.src; });
            currentIndex = galleryImages.indexOf(src);
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }

        function navLightbox(dir) {
            if (galleryImages.length === 0) return;
            currentIndex = (currentIndex + dir + galleryImages.length) % galleryImages.length;
            document.getElementById('lightbox-img').src = galleryImages[currentIndex];
        }

        document.addEventListener('keydown', function(e) {
            var lb = document.getElementById('lightbox');
            if (!lb.classList.contains('active')) return;
            if (e.key === 'ArrowRight') navLightbox(1);
            else if (e.key === 'ArrowLeft') navLightbox(-1);
            else if (e.key === 'Escape') closeLightbox();
        });
    </script>
