    <title>NEVERHOME - Merch</title>
    <style>
        .pageframe {
            width:90vmin;
            height:fit-content;
            margin:auto;
            padding:0;
            text-align:center;
            color:rgb(255, 255, 255);
            max-width:98%;
        }

        .gridcontainer {
            width:100%;
            margin:auto;
            display:grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.4em;
            color:white;
        }

        .griditem {
            margin:0;
            padding:0;
        }

        .griditem img {
            width:100%;
            height:100%;
            object-fit: cover;
            transition: 0.2s ease-out;
            box-shadow: 0 0 0.6em rgba(0,0,0,0.5);
        }

        .griditem img:hover {
            opacity:0.95;
        }

        .sectionlabel {
            text-align:center;
            font-weight:bold;
            letter-spacing:0.15em;
            margin: 1.5em 0 0.6em 0;
            text-shadow: 0.05em 0.05em 0.3em rgba(0,0,0,0.7);
        }

        .sectionsub {
            text-align:center;
            font-size:0.8em;
            opacity:0.75;
            margin-bottom:1em;
        }

        .storegrid {
            width:100%;
            max-width: 74rem;
            margin:auto;
            display:grid;
            grid-template-columns: repeat(auto-fit, minmax(355px, 1fr));
            gap: 1.5em;
        }

        .storeitem {
            background: rgba(10,6,4,0.68);
            border-radius: 0.6em;
            padding: 1em;
            box-shadow: 0 0 0.6em rgba(0,0,0,0.5);
            display:flex;
            flex-direction:column;
            transition: 0.2s ease-out;
        }

        .storeitem.enlarged {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 300;
            width: min(92vw, 680px);
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 0 3em rgba(0,0,0,0.85);
        }

        .merchbackdrop {
            display:none;
            position:fixed;
            inset:0;
            background: rgba(0,0,0,0.75);
            z-index: 260;
        }

        .merchbackdrop.active {
            display:block;
        }

        .storeitem .itemimgwrap {
            position: relative;
        }

        .itemimgsplit {
            display:flex;
            gap:0.5em;
            width:100%;
        }

        .itemimgsplit img {
            box-sizing: border-box;
            width:50%;
            min-width:0;
            max-width:50%;
            flex: 0 1 50%;
            aspect-ratio: 3 / 4;
            object-fit: contain;
            background: rgb(237,231,217);
            border-radius: 0.4em;
            box-shadow: 0 0 0.4em rgba(0,0,0,0.5);
            display:block;
            cursor: zoom-in;
        }

        .itemimgsplit.singleimg img {
            width:100%;
            max-width:100%;
            flex: 0 1 100%;
        }

        .itemimglabel {
            text-align:center;
            font-size:0.65em;
            letter-spacing:0.1em;
            opacity:0.6;
            margin-top:0.2em;
        }

        .itemimglabels {
            display:flex;
        }

        .itemimglabels span {
            width:50%;
        }

        .itemimgfull {
            display:none;
        }

        .storeitem.enlarged .itemimgsplit,
        .storeitem.enlarged .itemimglabels {
            display:none;
        }

        .storeitem.enlarged .itemimgfull {
            display:block;
        }

        .itemimgfull img {
            width:100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            background: rgb(237,231,217);
            border-radius: 0.4em;
            box-shadow: 0 0 0.4em rgba(0,0,0,0.5);
            display:block;
            cursor: zoom-out;
        }

        .itemimgnav {
            position:absolute;
            top:50%;
            transform: translateY(-50%);
            width:2em;
            height:2em;
            border:none;
            border-radius:50%;
            background: rgba(10,6,4,0.65);
            color:white;
            font-size:1.2em;
            line-height:1;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            transition: 0.2s ease-out;
        }

        .itemimgnav:hover {
            background: rgba(10,6,4,0.9);
        }

        .itemimgprev {
            left:0.4em;
        }

        .itemimgnext {
            right:0.4em;
        }

        .itemimgdots {
            position:absolute;
            bottom:0.5em;
            left:0;
            right:0;
            display:flex;
            justify-content:center;
            gap:0.3em;
        }

        .itemimgdot {
            width:0.45em;
            height:0.45em;
            border-radius:50%;
            background: rgba(255,255,255,0.4);
        }

        .itemimgdot.active {
            background: rgb(255,190,120);
        }

        .storeitem .itemname {
            font-weight:bold;
            margin-top:0.6em;
            letter-spacing:0.05em;
        }

        .storeitem .itemnote {
            font-size:0.75em;
            opacity:0.75;
            margin-top:0.2em;
        }

        .storeitem .itemprice {
            margin-top:0.4em;
            font-weight:bold;
        }

        .storeitem .itemerror {
            margin-top:0.5em;
            font-size:0.72em;
            color: rgb(255,150,150);
            word-break: break-word;
        }

        .storeitem button {
            margin-top:0.8em;
            padding:0.6em;
            border:none;
            border-radius:0.3em;
            background: rgb(255,190,120);
            color: rgb(20,12,8);
            font-weight:bold;
            letter-spacing:0.08em;
            cursor:pointer;
            transition: 0.2s ease-out;
        }

        .storeitem button:hover {
            opacity:0.85;
        }

        .storeitem select.itemsize {
            margin-top:0.8em;
            padding:0.5em;
            border-radius:0.3em;
            border:1px solid rgba(255,255,255,0.25);
            background: rgba(0,0,0,0.35);
            color:white;
            font-weight:bold;
        }

    </style>
